<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ESP32-S3-Touch-AMOLED-1.8: demo: puck</title>
<meta name="description" content="A bouncing square: the pack&#39;s own reference app, proving its band-render contract with nothing borrowed from another device." />
<link rel="stylesheet" href="../styles.css" />
</head>
<body>
<div class="wrap">
  <div class="run-header">
    <div class="back"><a href="../index.html">&larr; puck</a></div>
    <h1>ESP32-S3-Touch-AMOLED-1.8: demo</h1>
    <p class="meta">running on ESP32-S3-Touch-AMOLED-1.8</p>
    <div class="badges"></div>
    <p>A bouncing square: the pack&#39;s own reference app, proving its band-render contract with nothing borrowed from another device.</p>
    <div class="links">
      <a href="https://github.com/s0lness/puck/blob/master/packs/esp32-s3-touch-amoled-18/firmware/apps/demo.c">source</a>
    </div>
  </div>

  <div class="emu-stage" id="stage">
    <div class="emu-frame" id="frame" style="width:980px;height:760px">
      <iframe id="emu" src="../emu/index.html?module=..%2Fmodules%2Fesp32-demo.wasm" width="980" height="760" title="ESP32-S3-Touch-AMOLED-1.8: demo running live" allow="autoplay"></iframe>
    </div>
  </div>

  <div class="run-footer"></div>
</div>
<script>
(function () {
  var NATIVE_W = 980, NATIVE_H = 760;
  var stage = document.getElementById("stage");
  var frame = document.getElementById("frame");
  function fit() {
    var scale = Math.min(1, stage.clientWidth / NATIVE_W);
    frame.style.transform = "scale(" + scale + ")";
    stage.style.height = Math.round(NATIVE_H * scale) + "px";
  }
  window.addEventListener("resize", fit);
  fit();
  
})();
</script>
</body>
</html>
