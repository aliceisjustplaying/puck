version: "1.0.0"

# The display and IMU drivers are the two esp32-fluidbox depends on for this
# exact board (fluidbox/main/idf_component.yml). The touch driver is not
# fluidbox's - that project never reads a touch coordinate - it is
# tinydraw's, whose esp32/main/physical_touch.cpp drives this enclosure's
# CST820 through it on real silicon (see touch.c's provenance comment).
dependencies:
  idf: ">=5.5"
  espressif/esp_lcd_co5300:
    version: "^2.1.0"
    public: true
  espressif/esp_lcd_touch_cst816s:
    version: "^1.1.1~2"
    public: true
  waveshare/qmi8658:
    version: "^2.0.0"
    public: true
